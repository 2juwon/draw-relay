name = "draw-relay"
main = "src/index.js"
compatibility_date = "2025-10-01"
workers_dev = true

[observability]
enabled = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "INBOX"
class_name = "Inbox"

# 무료 플랜은 SQLite 저장소를 쓰는 Durable Object만 가능
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Inbox"]
